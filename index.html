const TAGS = ["Designer","Aftershave","Perfume","Xmas","Fresh","Laundry","Floral","Fruity","Sweet","Woody & Spice"];
const norm = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const state = {q:"", tag:"All"};
const grid = document.getElementById("grid"), count = document.getElementById("count"), chips = document.getElementById("chips"), q = document.getElementById("q");
SCENTS.forEach(s => s._k = norm([s.n,s.b,s.d,s.t.join(" ")].join(" ")));

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

["All"].concat(TAGS).forEach(t => {
  const b = el("button","chip",t); b.type="button"; b.setAttribute("aria-pressed", t==="All");
  b.addEventListener("click", () => { state.tag=t; [...chips.children].forEach(c=>c.setAttribute("aria-pressed", c.textContent===t)); render(); });
  chips.appendChild(b);
});
q.addEventListener("input", () => { state.q = norm(q.value.trim()); render(); });

function render(){
  const words = state.q.split(/\s+/).filter(Boolean);
  const list = SCENTS.filter(s => (state.tag==="All" || s.t.includes(state.tag)) && words.every(w => s._k.includes(w)));
  grid.replaceChildren();
  if(!list.length){ grid.appendChild(el("p","empty","No scents found. Try another word or filter.")); }
  list.forEach(s => {
    const c = el("article","card");
    c.appendChild(el("h2",null,s.n));
    if(s.b) c.appendChild(el("p","by","Inspired by "+s.b));
    c.appendChild(el("p","desc",s.d));
    const t = el("div","tags"); s.t.forEach(x => t.appendChild(el("span","tag",x))); c.appendChild(t);
    grid.appendChild(c);
  });
  count.textContent = list.length===SCENTS.length ? SCENTS.length+" scents" : list.length+" of "+SCENTS.length+" scents";
}
render();
